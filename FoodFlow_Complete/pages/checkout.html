<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout - FoodFlow</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/navbar.css"><link rel="stylesheet" href="../css/responsive.css"></head>
<body><header class="navbar"><a class="logo" href="../index.html">🍴 <span>FoodFlow</span></a><nav class="nav-links"><a href="../index.html">Home</a><a href="restaurants.html">Restaurants</a><a href="orders.html">Orders</a><a href="cart.html">🛒 Cart <span class="cart-count">0</span></a></nav><button class="menu-toggle">☰</button></header>
<main><div class="page-header"><span class="eyebrow">FINAL STEP</span><h1>Checkout</h1><p>Enter delivery details and place your order.</p></div>
<section class="section" style="padding-top:10px"><form id="checkoutForm" class="cart-layout" style="padding:0;max-width:1200px"><div class="panel"><h3>Delivery Details</h3><div class="form-group"><label>Name</label><input id="customerName" readonly></div><div class="form-group"><label>Email</label><input id="customerEmail" readonly></div><div class="form-group"><label>Phone</label><input id="phone" required pattern="[0-9]{10}" placeholder="10-digit phone number"></div><div class="form-group"><label>Address</label><textarea id="address" rows="3" required placeholder="House no., street, area"></textarea></div><div class="form-group"><label>City</label><input id="city" required value="Guntur"></div><div class="form-group"><label>Pincode</label><input id="pincode" required pattern="[0-9]{6}" placeholder="522xxx"></div><div class="form-group"><label>Payment Method</label><select id="payment"><option>Cash on Delivery</option><option>UPI (Demo)</option><option>Card (Demo)</option></select></div><button class="btn btn-primary" style="width:100%">Place Order</button></div>
<aside class="panel"><h3>Order Summary</h3><div class="summary-line"><span>Subtotal</span><strong id="checkoutSubtotal">₹0</strong></div><div class="summary-line"><span>Delivery</span><strong id="checkoutDelivery">₹0</strong></div><div class="summary-line"><span>Platform Fee</span><strong id="checkoutFee">₹0</strong></div><div class="summary-total"><span>Total</span><strong id="checkoutTotal">₹0</strong></div></aside></form></section></main>
<script src="../js/main.js"></script><script src="../js/auth.js"></script><script src="../js/checkout.js"></script></body></html>
