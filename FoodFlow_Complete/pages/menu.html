<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Menu - FoodFlow</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/navbar.css"><link rel="stylesheet" href="../css/responsive.css">
<style>
.menu-header{max-width:1200px;margin:auto;padding:40px 24px 20px}.menu-header h1{font-size:2.7rem;color:var(--dark)}.menu-tools{max-width:1200px;margin:auto;padding:0 24px 20px;display:flex;gap:12px;align-items:center}.menu-tools input{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:11px}.menu-tabs{max-width:1200px;margin:0 auto;padding:0 24px 20px;display:flex;gap:8px;flex-wrap:wrap}.menu-tab{padding:9px 14px;border-radius:10px;background:#fff;border:1px solid var(--border);font-weight:700}.menu-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}.menu-grid{max-width:1200px;margin:auto;padding:10px 24px 110px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.menu-card{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden}.menu-image{height:170px;display:grid;place-items:center;background:linear-gradient(135deg,#fff0e9,#fff9f5);font-size:5rem}.menu-body{padding:17px}.menu-title-row{display:flex;align-items:center;gap:8px}.menu-title-row h3{font-size:1.1rem}.menu-body p{color:var(--muted);margin:6px 0 14px}.veg-dot{width:10px;height:10px;border-radius:50%;border:2px solid #168b55;display:inline-block}.veg-dot.nonveg{border-color:#c53b2e}.menu-bottom{display:flex;align-items:center;justify-content:space-between}.qty-box{display:flex;align-items:center;gap:10px}.qty-box button{width:32px;height:32px;border-radius:9px;background:#fff0ea;color:var(--primary);font-weight:900}.qty-box b{min-width:15px;text-align:center}.add-btn{padding:8px 15px;background:var(--primary);color:#fff;border-radius:9px;font-weight:800}.floating-cart{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:999;display:flex;align-items:center;gap:18px;background:#17202a;color:#fff;padding:13px 18px;border-radius:16px;box-shadow:0 15px 35px rgba(0,0,0,.2)}
@media(max-width:900px){.menu-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.menu-grid{grid-template-columns:1fr}.menu-header,.menu-tools,.menu-tabs{padding-left:16px;padding-right:16px}.menu-tools{flex-direction:column;align-items:stretch}}
</style></head>
<body>
<header class="navbar"><a class="logo" href="../index.html">🍴 <span>FoodFlow</span></a><nav class="nav-links"><a href="../index.html">Home</a><a href="restaurants.html">Restaurants</a><a href="orders.html">Orders</a><a href="login.html" class="login-link">Login</a><a href="cart.html">🛒 Cart <span class="cart-count">0</span></a></nav><button class="menu-toggle">☰</button></header>
<main><div class="menu-header"><span class="eyebrow">MENU</span><h1 id="restaurantName">Restaurant</h1><p class="muted" id="restaurantMeta"></p></div>
<div class="menu-tools"><input id="menuSearch" placeholder="Search menu items..."></div>
<div class="menu-tabs"><button class="menu-tab active" data-category="All">All</button><button class="menu-tab" data-category="Main Course">Main Course</button><button class="menu-tab" data-category="Starters">Starters</button><button class="menu-tab" data-category="Pizza">Pizza</button><button class="menu-tab" data-category="Burgers">Burgers</button><button class="menu-tab" data-category="Desserts">Desserts</button><button class="menu-tab" data-category="Drinks">Drinks</button></div>
<div id="menuGrid" class="menu-grid"></div><div class="floating-cart"><span>Cart total <b id="floatingTotal">₹0</b></span><button id="viewCart" class="btn btn-primary">View Cart</button></div>
</main><script src="../js/main.js"></script><script src="../js/auth.js"></script><script src="../js/menu.js"></script></body></html>
