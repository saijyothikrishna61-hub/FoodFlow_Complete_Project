<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cart - FoodFlow</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/navbar.css"><link rel="stylesheet" href="../css/responsive.css">
<style>.cart-layout{max-width:1200px;margin:0 auto;padding:15px 24px 70px;display:grid;grid-template-columns:1.5fr .8fr;gap:22px}.cart-row{display:grid;grid-template-columns:58px 1fr auto auto auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}.cart-row:last-child{border-bottom:0}.cart-thumb{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;background:#fff1eb;font-size:2rem}.cart-info{display:flex;flex-direction:column}.cart-info small{color:var(--muted)}.summary-line{display:flex;justify-content:space-between;padding:8px 0}.summary-total{display:flex;justify-content:space-between;border-top:1px solid var(--border);margin-top:10px;padding-top:15px;font-size:1.2rem}.qty-box{display:flex;align-items:center;gap:10px}.qty-box button{width:31px;height:31px;border-radius:9px;background:#fff0ea;color:var(--primary);font-weight:900}.remove-item{background:none;color:#a09a95;font-size:1.1rem}@media(max-width:850px){.cart-layout{grid-template-columns:1fr}.cart-row{grid-template-columns:52px 1fr auto}.cart-row>.remove-item{justify-self:end}.cart-row>.qty-box{grid-column:2}.cart-row>strong:last-of-type{grid-column:3;grid-row:1/3}.cart-thumb{width:52px;height:52px}}</style></head>
<body><header class="navbar"><a class="logo" href="../index.html">🍴 <span>FoodFlow</span></a><nav class="nav-links"><a href="../index.html">Home</a><a href="restaurants.html">Restaurants</a><a href="orders.html">Orders</a><a href="login.html" class="login-link">Login</a><a href="cart.html">🛒 Cart <span class="cart-count">0</span></a></nav><button class="menu-toggle">☰</button></header>
<main><div class="page-header"><span class="eyebrow">YOUR ORDER</span><h1>Shopping Cart</h1><p>Review your items before checkout.</p></div>
<div id="cartEmpty" class="empty-state" style="max-width:1200px;margin:15px auto 70px"><div style="font-size:3rem">🛒</div><h3>Your cart is empty</h3><p class="muted">Add something delicious first.</p><a href="restaurants.html" class="btn btn-primary" style="margin-top:15px">Browse Restaurants</a></div>
<div id="cartSummary" class="cart-layout" style="display:none"><div id="cartItems" style="display:flex;flex-direction:column;gap:15px"></div><aside class="panel"><h3>Bill Summary</h3><div class="summary-line"><span>Subtotal</span><strong id="subtotal">₹0</strong></div><div class="summary-line"><span>Delivery Fee</span><strong id="deliveryFee">₹0</strong></div><div class="summary-line"><span>Platform Fee</span><strong id="platformFee">₹0</strong></div><div class="summary-total"><span>Total</span><strong id="grandTotal">₹0</strong></div><button id="checkoutBtn" class="btn btn-primary" style="width:100%;margin-top:18px">Proceed to Checkout</button><button id="clearCart" class="btn btn-light" style="width:100%;margin-top:9px">Clear Cart</button></aside></div></main>
<script src="../js/main.js"></script><script src="../js/auth.js"></script><script src="../js/cart.js"></script></body></html>
