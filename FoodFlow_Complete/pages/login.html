<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login - FoodFlow</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/navbar.css"><link rel="stylesheet" href="../css/responsive.css"></head>
<body>
<header class="navbar"><a class="logo" href="../index.html">🍴 <span>FoodFlow</span></a><nav class="nav-links"><a href="../index.html">Home</a><a href="restaurants.html">Restaurants</a><a href="orders.html" class="login-link">Orders</a><a href="cart.html">🛒 Cart <span class="cart-count">0</span></a></nav><button class="menu-toggle">☰</button></header>
<main class="section"><div style="max-width:520px;margin:auto"><div class="panel"><div class="center"><span class="eyebrow">ACCOUNT</span><h1>Welcome to FoodFlow</h1><p class="muted">Login or create an account to continue.</p></div>
<div style="display:flex;gap:8px;margin:22px 0"><button id="loginTab" class="btn btn-primary" style="flex:1">Login</button><button id="registerTab" class="btn btn-light" style="flex:1">Register</button></div>
<div id="authMessage" style="display:none"></div>
<form id="loginForm"><div class="form-group"><label>Email</label><input name="email" type="email" required placeholder="you@example.com"></div><div class="form-group"><label>Password</label><input name="password" type="password" required placeholder="••••••"></div><button class="btn btn-primary" style="width:100%">Login</button></form>
<form id="registerForm" style="display:none"><div class="form-group"><label>Name</label><input name="name" required></div><div class="form-group"><label>Email</label><input name="email" type="email" required></div><div class="form-group"><label>Password</label><input name="password" type="password" minlength="6" required></div><div class="form-group"><label>Role</label><select name="role"><option value="customer">Customer</option><option value="restaurant">Restaurant</option><option value="delivery">Delivery Partner</option></select></div><button class="btn btn-primary" style="width:100%">Create Account</button></form>
<div class="notice" style="margin-top:18px">Demo accounts: customer@foodflow.com / 123456 • restaurant@foodflow.com / 123456 • delivery@foodflow.com / 123456</div>
</div></div></main>
<script src="../js/main.js"></script><script src="../js/auth.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const lt=document.getElementById("loginTab"),rt=document.getElementById("registerTab"),lf=document.getElementById("loginForm"),rf=document.getElementById("registerForm");
 lt.onclick=()=>{lf.style.display="block";rf.style.display="none";lt.className="btn btn-primary";rt.className="btn btn-light"};
 rt.onclick=()=>{lf.style.display="none";rf.style.display="block";rt.className="btn btn-primary";lt.className="btn btn-light"};
});
</script></body></html>
