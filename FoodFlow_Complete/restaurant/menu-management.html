<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Menu Management - FoodFlow</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/navbar.css"><link rel="stylesheet" href="../css/responsive.css"><style>.manage-layout{max-width:1000px;margin:auto;padding:10px 24px 70px}.menu-manage-row{display:grid;grid-template-columns:1fr 140px 140px 80px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}@media(max-width:650px){.menu-manage-row{grid-template-columns:1fr 100px;}.menu-manage-row>*:nth-child(3),.menu-manage-row>*:nth-child(4){grid-column:2}}</style></head>
<body data-role="restaurant"><header class="navbar"><a class="logo" href="../index.html">🍴 <span>FoodFlow</span></a><nav class="nav-links"><a href="dashboard.html">Dashboard</a><a href="menu-management.html">Menu</a><a href="orders.html">Orders</a><a href="#" data-logout>Logout</a></nav><button class="menu-toggle">☰</button></header>
<main><div class="page-header"><span class="eyebrow">MENU</span><h1>Menu Management</h1><p>Add a demo item to the Spice Garden menu.</p></div><div class="manage-layout"><div class="panel"><div style="display:grid;grid-template-columns:1fr 140px 140px auto;gap:10px;align-items:end"><div class="form-group" style="margin:0"><label>Name</label><input id="newName" placeholder="New item"></div><div class="form-group" style="margin:0"><label>Price</label><input id="newPrice" type="number" min="1" placeholder="199"></div><div class="form-group" style="margin:0"><label>Category</label><select id="newCategory"><option>Main Course</option><option>Starters</option><option>Desserts</option><option>Drinks</option></select></div><button id="addMenu" class="btn btn-primary">Add</button></div></div><div class="panel" style="margin-top:16px"><h3>Current Items</h3><div id="menuManageList"></div></div></div></main>
<script src="../js/auth.js"></script><script src="../js/menu.js"></script><script>
document.addEventListener("DOMContentLoaded",()=>{
 if(!FoodFlowAuth.getCurrentUser()||FoodFlowAuth.getCurrentUser().role!=="restaurant"){location.href="../pages/login.html";return}
 const key="foodflowCustomMenu"; const base=JSON.parse(localStorage.getItem(key)||"[]");
 const list=document.getElementById("menuManageList");
 function render(){const data=JSON.parse(localStorage.getItem(key)||"[]");list.innerHTML=(data.length?data:MENU_DATA["spice-garden"].map(x=>({id:x[0],name:x[1],category:x[2],price:x[3],emoji:x[4]}))).map(i=>`<div class="menu-manage-row"><strong>${i.emoji||"🍽️"} ${i.name}</strong><span>${i.category}</span><span>₹${i.price}</span><button class="btn btn-danger" onclick="removeItem('${i.id}')">Delete</button></div>`).join("")}
 window.removeItem=id=>{const data=JSON.parse(localStorage.getItem(key)||"[]");localStorage.setItem(key,JSON.stringify(data.filter(i=>i.id!==id)));render()};
 document.getElementById("addMenu").onclick=()=>{const name=document.getElementById("newName").value.trim(),price=Number(document.getElementById("newPrice").value),category=document.getElementById("newCategory").value;if(!name||!price)return;const data=JSON.parse(localStorage.getItem(key)||"[]");data.push({id:"custom"+Date.now(),name,category,price,emoji:"🍽️"});localStorage.setItem(key,JSON.stringify(data));render()};
 render();
});
</script></body></html>
